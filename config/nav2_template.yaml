/**:
  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 5.0
      controller_plugins: ["FollowPath"]
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.25
      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        transform_tolerance: 0.2
        max_vel_x: 1.0
        min_vel_x: 0.0
        max_vel_y: 0.0
        min_vel_y: 0.0
        max_vel_theta: 2.0
        min_speed_xy: 0.0
        max_speed_xy: 1.0
        min_speed_theta: 0.0
        acc_lim_x: 2.5
        acc_lim_y: 0.0
        acc_lim_theta: 3.2
        decel_lim_x: -2.5
        decel_lim_y: 0.0
        decel_lim_theta: -3.2
        vx_samples: 15
        vy_samples: 1
        vtheta_samples: 15

        critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
        BaseObstacle.scale: 0.02
        PathAlign.scale: 32.0
        PathAlign.forward_point_distance: 0.1
        GoalAlign.scale: 24.0
        GoalAlign.forward_point_distance: 0.1
        PathDist.scale: 32.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 32.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0

  planner_server:
    ros__parameters:
      use_sim_time: True
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"

  behavior_server:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: <ROBOT_NAME>/base_footprint
      local_frame: <ROBOT_NAME>/odom

  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: <ROBOT_NAME>/base_footprint
      odom_topic: /<ROBOT_NAME>/odom

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: True
        global_frame: <ROBOT_NAME>/odom
        robot_base_frame: <ROBOT_NAME>/base_footprint
        update_frequency: 2.0
        publish_frequency: 1.0
        rolling_window: True
        width: 3
        height: 3
        resolution: 0.05
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          observation_sources: scan
          scan:
            topic: /<ROBOT_NAME>/scan
            data_type: "LaserScan"
            clearing: True
            marking: True
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.55

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: True
        global_frame: map
        robot_base_frame: <ROBOT_NAME>/base_footprint
        update_frequency: 2.0
        publish_frequency: 1.0
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          map_topic: "/map"
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          observation_sources: scan
          scan:
            topic: /<ROBOT_NAME>/scan
            data_type: "LaserScan"
            clearing: True
            marking: True
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.55

  waypoint_follower:
    ros__parameters:
      use_sim_time: True
      loop_rate: 200
      stop_on_failure: False

  velocity_smoother:
    ros__parameters:
      use_sim_time: True
      odom_topic: /<ROBOT_NAME>/odom

  smoother_server:
    ros__parameters:
      use_sim_time: True

  route_server:
    ros__parameters:
      use_sim_time: True

  collision_monitor:
    ros__parameters:
      use_sim_time: True
      base_frame_id: <ROBOT_NAME>/base_footprint
      odom_frame_id: <ROBOT_NAME>/odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel
      observation_sources: ["scan"]
      scan:
        type: "scan"
        topic: /<ROBOT_NAME>/scan
      polygons: ["PolygonStop"]
      PolygonStop:
        type: "polygon"
        points: "[[0.55, 0.55], [0.55, -0.55], [-0.55, -0.55], [-0.55, 0.55]]"
        action_type: "stop"
        min_points: 4
        visualize: True
        polygon_pub_topic: "polygon_stop"

  docking_server:
    ros__parameters:
      use_sim_time: True
      base_frame: <ROBOT_NAME>/base_footprint
      odom_frame: <ROBOT_NAME>/odom
      dock_plugins: ['simple_charging_dock']
      simple_charging_dock:
        plugin: 'opennav_docking::SimpleChargingDock'
        docking_threshold: 0.05
        staging_distance: 0.5
        use_battery_status: False